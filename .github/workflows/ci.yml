name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run backend API tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-only-secret-with-at-least-32-characters
          MONGO_URI: mongodb://127.0.0.1:27017/spendsense_ci_test
          ML_SERVICE_URL: http://127.0.0.1:1
        run: npm test
      - name: Install ML dependencies
        run: python -m pip install -r backend/ml/requirements.txt
      - name: Run ML unit tests
        working-directory: backend/ml
        run: python -m unittest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
        run: npm run build
